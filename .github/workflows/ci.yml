name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Pin vcaml to OCaml 5-compatible version
        run: opam pin add vcaml 0.17.0 --no-action --yes

      - name: Install dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Run tests
        run: opam exec -- dune test
